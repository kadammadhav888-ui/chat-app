<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Private Chat</title>
<style>
:root{--bg:#14101a;--card:#1f1828;--me:#7c3aed;--them:#2d2438;--text:#f4eefc;--muted:#a597b8;--err:#ff7b8a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.hidden{display:none!important}
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);padding:28px;border-radius:18px;width:100%;max-width:380px;box-shadow:0 10px 40px #0008}
h1{margin:0 0 4px;font-size:22px}
p.sub{margin:0 0 18px;color:var(--muted);font-size:14px}
input{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:10px;border:1px solid #3a2f48;background:#17111f;color:var(--text);font-size:15px;outline:none}
input:focus{border-color:var(--me)}
button{cursor:pointer;border:0;border-radius:10px;background:var(--me);color:#fff;padding:12px 16px;font-size:15px;font-weight:600}
button.full{width:100%}
button.ghost{background:transparent;color:var(--muted);border:1px solid #3a2f48;padding:8px 12px;font-size:13px}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:8px}
.app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--card);gap:8px}
header b{font-size:16px}
header small{display:block;color:var(--muted);font-size:12px}
header div.btns{display:flex;gap:6px}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--them);word-wrap:break-word;white-space:pre-wrap;font-size:15px}
.m.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.m:not(.me){align-self:flex-start;border-bottom-left-radius:4px}
.m .who{font-size:11px;color:#d6c6f0;margin-bottom:2px;opacity:.8}
.m .time{font-size:10px;opacity:.6;margin-top:3px;text-align:right}
form.send{display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card)}
form.send input{margin:0}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="box">
    <h1>🔒 Private Chat</h1>
    <p class="sub">End-to-end encrypted. Only the two of you can read this.</p>
    <input id="name" placeholder="Your name" autocomplete="off">
    <input id="code" value="madhav" placeholder="Chat code (same for both of you)" autocomplete="off">
    <input id="pw" type="password" placeholder="Password">
    <button class="full" id="enter">Enter chat</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="app hidden" id="app">
  <header>
    <div><b>💬 Our Chat</b><small>🔒 End-to-end encrypted</small></div>
    <div class="btns">
      <button class="ghost" id="chgBtn">Change password</button>
      <button class="ghost" id="outBtn">Lock</button>
    </div>
  </header>
  <div id="msgs"></div>
  <form class="send" id="sendForm">
    <input id="text" placeholder="Type a message…" autocomplete="off">
    <button>Send</button>
  </form>
</div>

<div class="modal hidden" id="modal">
  <div class="box">
    <h1>Change password</h1>
    <p class="sub">All messages will be re-encrypted. Tell your partner the new password.</p>
    <input id="newPw" type="password" placeholder="New password (min 8 characters)">
    <input id="newPw2" type="password" placeholder="Repeat new password">
    <button class="full" id="saveChg">Change password</button>
    <button class="ghost full" id="cancelChg" style="margin-top:8px">Cancel</button>
    <div class="err" id="chgErr"></div>
  </div>
</div>

<script>
// ====== SETUP: paste your Firebase Realtime Database URL here ======
const DB_URL = "https://private-chat-dec1c-default-rtdb.firebaseio.com";
// ===================================================================

const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

let S = null; // {name, code, key, salt}
let seen = new Set(), timer = null;

async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: unb64(salt), iterations: 250000, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
}
async function encrypt(key, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, enc.encode(text));
  return b64(iv) + "." + b64(ct);
}
async function decrypt(key, data) {
  const [iv, ct] = data.split(".");
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(iv)}, key, unb64(ct));
  return dec.decode(pt);
}

const url = path => `${DB_URL}/rooms/${S ? S.code : ""}${path}.json`;
async function db(method, u, body) {
  const r = await fetch(u, {method, body: body === undefined ? undefined : JSON.stringify(body)});
  if (!r.ok) throw new Error("Network/DB error " + r.status);
  return r.json();
}

async function login() {
  const name = $("name").value.trim(), code = $("code").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
  const pw = $("pw").value;
  const err = $("loginErr"); err.textContent = "";
  if (!name || !code || !pw) return err.textContent = "Fill in all fields.";
  if (DB_URL.includes("YOUR-PROJECT")) return err.textContent = "Set DB_URL in the file first.";
  $("enter").disabled = true; $("enter").textContent = "Checking…";
  try {
    S = {name, code};
    const meta = await db("GET", url("/meta"));
    if (!meta) {
      if (pw.length < 8) throw new Error("Use at least 8 characters for a new chat.");
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      const key = await deriveKey(pw, salt);
      await db("PUT", url("/meta"), {salt, verify: await encrypt(key, "ok-v1")});
      S.key = key; S.salt = salt;
    } else {
      const key = await deriveKey(pw, meta.salt);
      try { await decrypt(key, meta.verify); } catch { throw new Error("Wrong password (or it was changed — ask your partner)."); }
      S.key = key; S.salt = meta.salt;
    }
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    $("pw").value = ""; $("msgs").innerHTML = ""; seen = new Set();
    await poll(); timer = setInterval(poll, 2000);
  } catch (e) { S = null; err.textContent = /fetch|network/i.test(e.message) ? "Cannot reach the database. Open this page from your GitHub Pages link (not inside Claude), check internet, and check DB_URL." : e.message; }
  $("enter").disabled = false; $("enter").textContent = "Enter chat";
}

function lock(msg) {
  clearInterval(timer); S = null;
  $("app").classList.add("hidden"); $("modal").classList.add("hidden");
  $("login").classList.remove("hidden"); $("loginErr").textContent = msg || "";
}

function addMsg(id, obj, ts) {
  const d = document.createElement("div");
  d.className = "m" + (obj.n === S.name ? " me" : "");
  if (obj.n !== S.name) { const w = document.createElement("div"); w.className = "who"; w.textContent = obj.n; d.appendChild(w); }
  const t = document.createElement("div"); t.textContent = obj.m; d.appendChild(t);
  const tm = document.createElement("div"); tm.className = "time";
  tm.textContent = new Date(ts).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}); d.appendChild(tm);
  const box = $("msgs"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.appendChild(d); if (atBottom || obj.n === S.name) box.scrollTop = box.scrollHeight;
}

let polling = false;
async function poll() {
  if (!S || polling) return; polling = true;
  try {
    const meta = await db("GET", url("/meta"));
    if (!meta || meta.salt !== S.salt) { polling = false; return lock("Password was changed. Enter the new password."); }
    const all = await db("GET", url("/messages"));
    if (all) for (const k of Object.keys(all).sort()) {
      if (seen.has(k)) continue; seen.add(k);
      try { addMsg(k, JSON.parse(await decrypt(S.key, all[k].c)), all[k].t); } catch {}
    }
  } catch (e) {}
  polling = false;
}

async function send(e) {
  e.preventDefault();
  const v = $("text").value.trim(); if (!v || !S) return;
  $("text").value = "";
  try {
    const c = await encrypt(S.key, JSON.stringify({n: S.name, m: v}));
    await db("POST", url("/messages"), {t: Date.now(), c});
    poll();
  } catch { $("text").value = v; }
}

async function changePw() {
  const a = $("newPw").value, b = $("newPw2").value, err = $("chgErr"); err.textContent = "";
  if (a.length < 8) return err.textContent = "Minimum 8 characters.";
  if (a !== b) return err.textContent = "Passwords don't match.";
  $("saveChg").disabled = true; $("saveChg").textContent = "Re-encrypting…";
  try {
    const all = (await db("GET", url("/messages"))) || {};
    const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    const key = await deriveKey(a, salt);
    const msgs = {};
    for (const k of Object.keys(all)) {
      try { msgs[k] = {t: all[k].t, c: await encrypt(key, await decrypt(S.key, all[k].c))}; } catch {}
    }
    const payload = {meta: {salt, verify: await encrypt(key, "ok-v1")}};
    if (Object.keys(msgs).length) payload.messages = msgs;
    await db("PUT", `${DB_URL}/rooms/${S.code}.json`, payload);
    S.key = key; S.salt = salt;
    $("modal").classList.add("hidden"); $("newPw").value = $("newPw2").value = "";
    alert("Password changed. Share the new password with your partner.");
  } catch (e) { err.textContent = e.message; }
  $("saveChg").disabled = false; $("saveChg").textContent = "Change password";
}

$("enter").onclick = login;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("sendForm").onsubmit = send;
$("outBtn").onclick = () => lock();
$("chgBtn").onclick = () => { $("chgErr").textContent = ""; $("modal").classList.remove("hidden"); };
$("cancelChg").onclick = () => $("modal").classList.add("hidden");
$("saveChg").onclick = changePw;
</script>
</body>
</html>
