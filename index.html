<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permanent Secure Private Chat</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- CryptoJS AES-256 Encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0b1329; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .card { background: #162238; border-radius: 18px; width: 100%; max-width: 480px; box-shadow: 0 12px 30px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; height: 92vh; border: 1px solid #1e293b; }
        .hidden { display: none !important; }

        /* Lock Screen */
        .lock-container { padding: 36px 24px; text-align: center; margin: auto 0; }
        .lock-icon { font-size: 3rem; margin-bottom: 12px; }
        .lock-container h2 { font-size: 1.45rem; margin-bottom: 8px; color: #38bdf8; }
        .lock-container p { color: #94a3b8; font-size: 0.88rem; margin-bottom: 24px; line-height: 1.4; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: #93c5fd; margin-bottom: 6px; font-weight: 500; }
        .input-group input { width: 100%; padding: 12px 14px; background: #0b1329; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; transition: border 0.2s; }
        .input-group input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 13px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn-secondary { background: #334155; margin-top: 8px; }
        .btn-secondary:hover { background: #475569; }

        /* Chat Screen */
        .chat-header { background: #0f172a; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
        .chat-title h3 { font-size: 1rem; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
        .chat-title span { font-size: 0.72rem; color: #10b981; }
        .header-actions button { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; margin-left: 5px; }
        .header-actions button:hover { background: #334155; color: #fff; }

        .messages-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #162238; }
        .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 0.92rem; line-height: 1.4; word-break: break-word; position: relative; }
        .msg-sender { font-size: 0.7rem; font-weight: 600; margin-bottom: 2px; opacity: 0.85; }
        .msg-time { font-size: 0.65rem; text-align: right; margin-top: 4px; opacity: 0.7; }
        .msg-me { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
        .msg-partner { align-self: flex-start; background: #1e293b; color: #f1f5f9; border-bottom-left-radius: 2px; border: 1px solid #334155; }

        .chat-input-area { padding: 12px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 12px 14px; background: #162238; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
        .chat-input-area input:focus { border-color: #38bdf8; }
        .chat-input-area button { padding: 0 18px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; padding: 16px; z-index: 99; }
        .modal-box { background: #162238; padding: 22px; border-radius: 12px; max-width: 360px; width: 100%; border: 1px solid #334155; }
        .modal-box h4 { margin-bottom: 10px; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="card">
        <!-- LOGIN / UNLOCK SCREEN -->
        <div id="lockScreen" class="lock-container">
            <div class="lock-icon">🔐</div>
            <h2>Private Permanent Chat</h2>
            <p>मैसेज हमेशा Firebase डेटाबेस में सुरक्षित सेव रहेंगे, जब तक आप खुद डिलीट बटन नहीं दबाएंगे।</p>
            
            <div class="input-group">
                <label>आपका नाम</label>
                <input type="text" id="userNameInput" placeholder="उदा. Madhav">
            </div>

            <div class="input-group">
                <label>सीक्रेट पासवर्ड (Encryption Key)</label>
                <input type="password" id="secretKeyInput" placeholder="दोनों का पासवर्ड एक ही होना चाहिए">
            </div>

            <button class="btn" onclick="startChat()">चैट रूम अनलॉक करें</button>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chatScreen" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            <div class="chat-header">
                <div class="chat-title">
                    <h3>💬 सुरक्षित चैट</h3>
                    <span>● स्थायी सुरक्षित डेटा</span>
                </div>
                <div class="header-actions">
                    <button onclick="openChangePasswordModal()" title="पासवर्ड बदलें">🔑 पासवर्ड</button>
                    <button onclick="clearAllChat()" title="सिर्फ खुद से डिलीट करने पर ही मिटेगी">🗑️ डिलीट करें</button>
                    <button onclick="lockApp()" title="स्क्रीन लॉक करें">🔒 लॉक</button>
                </div>
            </div>

            <div class="messages-box" id="messagesBox">
                <!-- पुराने और नए सारे मैसेजेस यहाँ लोड होंगे -->
            </div>

            <form class="chat-input-area" onsubmit="sendMessage(event)">
                <input type="text" id="messageInput" placeholder="यहाँ मैसेज टाइप करें..." autocomplete="off">
                <button type="submit">भेजें</button>
            </form>
        </div>
    </div>

    <!-- Password Change Modal -->
    <div id="pwdModal" class="modal hidden">
        <div class="modal-box">
            <h4>नया सीक्रेट पासवर्ड सेट करें</h4>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 14px;">
                नया पासवर्ड डालते ही आगे के मैसेज नए पासवर्ड से एन्क्रिप्ट होंगे। पार्टनर को भी नया पासवर्ड ज़रूर बताएं।
            </p>
            <div class="input-group">
                <label>नया पासवर्ड</label>
                <input type="password" id="newPasswordInput" placeholder="नया सीक्रेट पासवर्ड डालें">
            </div>
            <button class="btn" onclick="saveNewPassword()">अपडेट करें</button>
            <button class="btn btn-secondary" onclick="closeChangePasswordModal()">रद्द करें</button>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKey_ReplaceWithYourActualKey",
            authDomain: "private-chat-dec1c.firebaseapp.com",
            databaseURL: "https://private-chat-dec1c-default-rtdb.firebaseio.com",
            projectId: "private-chat-dec1c",
            storageBucket: "private-chat-dec1c.appspot.com",
            messagingSenderId: "861199856",
            appId: "1:861199856:web:example"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        // यह नोड Firebase में हमेशा सुरक्षित रहेगा, कभी अपने आप डिलीट नहीं होगा
        const chatRef = db.ref("permanent_secure_messages");

        let currentUser = "";
        let secretKey = "";

        // --- 2. START CHAT & AUTH ---
        function startChat() {
            const name = document.getElementById("userNameInput").value.trim();
            const key = document.getElementById("secretKeyInput").value.trim();

            if (!name || !key) {
                alert("कृपया अपना नाम और सीक्रेट पासवर्ड दोनों भरें!");
                return;
            }

            currentUser = name;
            secretKey = key;

            // नाम को लोकल स्टोरेज में याद रखें ताकि बार-बार टाइप न करना पड़े
            localStorage.setItem("chat_user_name", name);

            document.getElementById("lockScreen").classList.add("hidden");
            document.getElementById("chatScreen").classList.remove("hidden");

            // सारे पुराने और नए मैसेज लोड करें
            loadAllMessages();
        }

        // पहले से सेव नाम भरें
        window.onload = function() {
            const savedName = localStorage.getItem("chat_user_name");
            if (savedName) {
                document.getElementById("userNameInput").value = savedName;
            }
        };

        // AES Encryption
        function encryptMessage(text, key) {
            return CryptoJS.AES.encrypt(text, key).toString();
        }

        // AES Decryption
        function decryptMessage(cipherText, key) {
            try {
                const bytes = CryptoJS.AES.decrypt(cipherText, key);
                const originalText = bytes.toString(CryptoJS.enc.Utf8);
                return originalText || "🔒 [पासवर्ड मेल नहीं खा रहा]";
            } catch (e) {
                return "🔒 [गलत पासवर्ड]";
            }
        }

        // --- 3. SEND & RECEIVE MESSAGES ---
        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text) return;

            // एंड-टू-एंड एन्क्रिप्शन
            const encryptedPayload = encryptMessage(text, secretKey);

            // Firebase Realtime Database में परमानेंट सेव होगा
            chatRef.push({
                sender: currentUser,
                encryptedText: encryptedPayload,
                timestamp: Date.now()
            });

            input.value = "";
        }

        function loadAllMessages() {
            chatRef.off();
            const messagesBox = document.getElementById("messagesBox");
            messagesBox.innerHTML = "";

            // child_added से सारे पुराने मैसेज भी लाइन से लोड होते हैं और नया मैसेज आते ही तुरंत दिखता है
            chatRef.on("child_added", (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const decryptedText = decryptMessage(data.encryptedText, secretKey);
                const isMe = data.sender === currentUser;
                const timeString = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const msgDiv = document.createElement("div");
                msgDiv.className = `msg ${isMe ? 'msg-me' : 'msg-partner'}`;
                msgDiv.innerHTML = `
                    <div class="msg-sender">${escapeHtml(data.sender)}</div>
                    <div>${escapeHtml(decryptedText)}</div>
                    <div class="msg-time">${timeString}</div>
                `;

                messagesBox.appendChild(msgDiv);
                messagesBox.scrollTop = messagesBox.scrollHeight;
            });
        }

        // --- 4. PASSWORD CHANGE & CLEAR CHAT ---
        function openChangePasswordModal() {
            document.getElementById("pwdModal").classList.remove("hidden");
        }

        function closeChangePasswordModal() {
            document.getElementById("pwdModal").classList.add("hidden");
        }

        function saveNewPassword() {
            const newKey = document.getElementById("newPasswordInput").value.trim();
            if (!newKey) {
                alert("नया पासवर्ड खाली नहीं हो सकता!");
                return;
            }
            secretKey = newKey;
            closeChangePasswordModal();
            alert("पासवर्ड अपडेट हो गया! अब चैट इसी पासवर्ड से लोड होगी।");
            loadAllMessages();
        }

        // जब तक यूजर खुद इस बटन को दबाकर कन्फर्म नहीं करेगा, चैट कभी डिलीट नहीं होगी
        function clearAllChat() {
            const confirmDelete = confirm("⚠️ क्या आप वाकई सारी चैट हमेशा के लिए मिटाना चाहते हैं? इसके बाद यह वापस नहीं आएगी!");
            if (confirmDelete) {
                chatRef.remove().then(() => {
                    document.getElementById("messagesBox").innerHTML = "";
                    alert("सारी चैट हमेशा के लिए डिलीट कर दी गई है।");
                }).catch((err) => {
                    alert("डिलीट करने में समस्या आई: " + err.message);
                });
            }
        }

        function lockApp() {
            secretKey = "";
            document.getElementById("chatScreen").classList.add("hidden");
            document.getElementById("lockScreen").classList.remove("hidden");
            document.getElementById("secretKeyInput").value = "";
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
